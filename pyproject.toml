[project]
name = "kk-submission"
version = "0.1.0"
description = "Knowledge System for the Dupaco website (hackathon submission)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40",
    "markdown-it-py>=3.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "bandit>=1.7",
    "build>=1.2",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["submission"]
include = ["kk*"]

[tool.setuptools.package-data]
kk = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["submission", "harness"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_data: needs the real snapshots/ folder; skipped when it is absent",
    "live: calls the Anthropic API; run manually",
]

[tool.coverage.run]
source = ["kk"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["harness", "eval", "snapshots", "starter", "snapshots_zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "B", "UP", "S", "PL"]

[tool.ruff.lint.isort]
known-first-party = ["kk", "solution", "contract", "tools"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106", "PLR2004"]
"tests/fixtures/**" = ["E501"]
"tools/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "submission:harness"
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests"]
